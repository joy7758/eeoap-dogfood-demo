[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeoap-dogfood-demo"
version = "0.0.0"
description = "Low-risk demo repository for future EEOAP candidate evaluation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
